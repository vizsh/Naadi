<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="NAADI architecture: sensors on the shed floor feed in-browser signal processing, detection, prognosis and decision math; a Next.js app on Vercel serves the views and the agent tools; every outward action passes the owner's approval gate.">
  <defs>
    <pattern id="fine" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#406C62" stroke-opacity=".09"/></pattern>
    <pattern id="bold" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#406C62" stroke-opacity=".2"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17191C"/></marker>
  </defs>
  <rect width="1280" height="760" fill="#F3F4EF"/>
  <rect width="1280" height="760" fill="url(#fine)"/>
  <rect width="1280" height="760" fill="url(#bold)"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" fill="#17191C">
    <text x="48" y="58" font-size="26" font-weight="700">How NAADI is put together</text>
    <text x="48" y="84" font-size="14.5" fill="#41474E">Solid boxes are built in this repository. Dashed boxes are designed and planned. Nothing outward happens without the owner.</text>

    <!-- lane 1: the shed floor -->
    <rect x="48" y="112" width="280" height="600" fill="#F9FAF6"/>
    <text x="68" y="146" font-size="17" font-weight="700">On the shed floor</text>
    <text x="68" y="168" font-size="12.5" fill="#656B72">Sensors, people, power cuts</text>
    <g font-size="14">
      <rect x="68" y="190" width="240" height="96" fill="none" stroke="#17191C" stroke-dasharray="5 4"/>
      <text x="84" y="216" font-weight="650">₹1,500 ESP32 clip-on kit</text>
      <text x="84" y="238" font-size="12.5" fill="#41474E">vibration · sound · current · temp</text>
      <text x="84" y="258" font-size="12.5" fill="#41474E">features on the edge, store and</text>
      <text x="84" y="276" font-size="12.5" fill="#41474E">forward when the signal drops</text>
      <rect x="68" y="304" width="240" height="96" fill="none" stroke="#17191C" stroke-width="1.5"/>
      <text x="84" y="330" font-weight="650">Phone as a sensor</text>
      <text x="84" y="352" font-size="12.5" fill="#41474E">microphone + accelerometer in the</text>
      <text x="84" y="372" font-size="12.5" fill="#41474E">browser, no install (Live Lab)</text>
      <text x="84" y="390" font-size="12.5" fill="#41474E">audio never leaves the device</text>
      <rect x="68" y="418" width="240" height="78" fill="none" stroke="#17191C" stroke-width="1.5"/>
      <text x="84" y="444" font-weight="650">Workers' voice notes</text>
      <text x="84" y="466" font-size="12.5" fill="#41474E">“खट-खट आवाज येतोय” becomes</text>
      <text x="84" y="484" font-size="12.5" fill="#41474E">evidence with a likelihood ratio</text>
      <rect x="68" y="514" width="240" height="78" fill="none" stroke="#17191C" stroke-width="1.5"/>
      <text x="84" y="540" font-weight="650">Calendar of idle windows</text>
      <text x="84" y="562" font-size="12.5" fill="#41474E">Sundays, shift gaps and scheduled</text>
      <text x="84" y="580" font-size="12.5" fill="#41474E">power cuts: free repair time</text>
      <rect x="68" y="610" width="240" height="82" fill="none" stroke="#17191C" stroke-dasharray="5 4"/>
      <text x="84" y="636" font-weight="650">Recorded datasets</text>
      <text x="84" y="658" font-size="12.5" fill="#41474E">NASA IMS run-to-failure, CWRU</text>
      <text x="84" y="676" font-size="12.5" fill="#41474E">bearing faults, MIMII machine sound</text>
    </g>

    <!-- lane 2: the browser -->
    <rect x="356" y="112" width="520" height="600" fill="#F9FAF6"/>
    <text x="376" y="146" font-size="17" font-weight="700">In the browser · works offline</text>
    <text x="376" y="168" font-size="12.5" fill="#656B72">All the maths runs here, deterministic and testable</text>
    <g font-size="14">
      <rect x="376" y="190" width="232" height="104" fill="none" stroke="#17191C" stroke-width="1.5"/>
      <text x="392" y="216" font-weight="650">Signal → features</text>
      <text x="392" y="238" font-size="12.5" fill="#41474E">FFT, log-mel bands, RMS, crest,</text>
      <text x="392" y="256" font-size="12.5" fill="#41474E">kurtosis, envelope at bearing tones</text>
      <text x="392" y="280" font-size="12" font-family="Consolas, Menlo, monospace" fill="#17191C">BPFO = (n/2)(1 − d/D)·fr</text>
      <rect x="624" y="190" width="232" height="104" fill="none" stroke="#17191C" stroke-width="1.5"/>
      <text x="640" y="216" font-weight="650">Learn normal → holes</text>
      <text x="640" y="238" font-size="12.5" fill="#41474E">per machine and operating regime;</text>
      <text x="640" y="256" font-size="12.5" fill="#41474E">tail probability &lt; 0.01 punches a hole</text>
      <text x="640" y="280" font-size="12" font-family="Consolas, Menlo, monospace">D² = (x−μ)ᵀ Σ⁻¹ (x−μ)</text>
      <rect x="376" y="310" width="232" height="104" fill="none" stroke="#17191C" stroke-width="1.5"/>
      <text x="392" y="336" font-weight="650">Prognosis</text>
      <text x="392" y="358" font-size="12.5" fill="#41474E">Page-Hinkley change point, growth</text>
      <text x="392" y="376" font-size="12.5" fill="#41474E">fit, 2,000-run Monte Carlo</text>
      <text x="392" y="400" font-size="12" font-family="Consolas, Menlo, monospace">d(t) = d₀·e^(b·t) → 1</text>
      <rect x="624" y="310" width="232" height="104" fill="none" stroke="#17191C" stroke-width="1.5"/>
      <text x="640" y="336" font-weight="650">Diagnosis and rupees</text>
      <text x="640" y="358" font-size="12.5" fill="#41474E">Bayesian ranking over the rulebook,</text>
      <text x="640" y="376" font-size="12.5" fill="#41474E">expected cost of every repair window</text>
      <text x="640" y="400" font-size="12" font-family="Consolas, Menlo, monospace">E[C] = F·C_bd + (1−F)·C_pl</text>
      <rect x="376" y="430" width="480" height="128" fill="#17191C"/>
      <text x="396" y="460" font-weight="700" fill="#F9FAF6">Views</text>
      <text x="396" y="484" font-size="13" fill="#D6DAD3">3D twin with card chains, x-ray inspection and exploded motor</text>
      <text x="396" y="504" font-size="13" fill="#D6DAD3">Card record · case file · spectrum · bearing section · sound</text>
      <text x="396" y="524" font-size="13" fill="#D6DAD3">Live Lab (mic and motion) · agent console · rulebook</text>
      <text x="396" y="544" font-size="13" fill="#D6DAD3">English, हिंदी, मराठी</text>
      <rect x="376" y="574" width="480" height="118" fill="none" stroke="#17191C" stroke-dasharray="5 4"/>
      <text x="392" y="600" font-weight="650">Offline storage and sync</text>
      <text x="392" y="622" font-size="12.5" fill="#41474E">IndexedDB card store, service worker cache, background sync</text>
      <text x="392" y="642" font-size="12.5" fill="#41474E">ONNX autoencoder for log-mel scores (onnxruntime-web)</text>
      <text x="392" y="662" font-size="12.5" fill="#41474E">SMS / WhatsApp fallback for alerts on 2G</text>
    </g>

    <!-- lane 3: Vercel -->
    <rect x="904" y="112" width="328" height="600" fill="#F9FAF6"/>
    <text x="924" y="146" font-size="17" font-weight="700">On Vercel</text>
    <text x="924" y="168" font-size="12.5" fill="#656B72">Next.js 16 · App Router · Turbopack</text>
    <g font-size="14">
      <rect x="924" y="190" width="288" height="96" fill="none" stroke="#17191C" stroke-width="1.5"/>
      <text x="940" y="216" font-weight="650">Static and server routes</text>
      <text x="940" y="238" font-size="12.5" fill="#41474E">/floor · /machine/[id] · /lab</text>
      <text x="940" y="258" font-size="12.5" fill="#41474E">/agents · /rulebook · overview</text>
      <rect x="924" y="304" width="288" height="96" fill="none" stroke="#17191C" stroke-width="1.5"/>
      <text x="940" y="330" font-weight="650">Agent run as data</text>
      <text x="940" y="352" font-size="12.5" fill="#41474E">Sentinel → Diagnostician → Prognostician</text>
      <text x="940" y="372" font-size="12.5" fill="#41474E">→ Procurement → Planner → Dispatcher</text>
      <text x="940" y="390" font-size="12.5" fill="#41474E">every result from a deterministic tool</text>
      <rect x="924" y="418" width="288" height="78" fill="none" stroke="#17191C" stroke-dasharray="5 4"/>
      <text x="940" y="444" font-weight="650">LLM narrator (optional)</text>
      <text x="940" y="466" font-size="12.5" fill="#41474E">writes the owner's summary in their</text>
      <text x="940" y="484" font-size="12.5" fill="#41474E">language; never does the arithmetic</text>
      <rect x="924" y="514" width="288" height="78" fill="none" stroke="#17191C" stroke-dasharray="5 4"/>
      <text x="940" y="540" font-weight="650">Shared store</text>
      <text x="940" y="562" font-size="12.5" fill="#41474E">Supabase Postgres + realtime for</text>
      <text x="940" y="580" font-size="12.5" fill="#41474E">technician and dealer views</text>
      <rect x="924" y="610" width="288" height="82" fill="#C8372A"/>
      <text x="940" y="638" font-weight="700" fill="#F9FAF6">Owner approval gate</text>
      <text x="940" y="660" font-size="12.5" fill="#F9FAF6">WhatsApp drafts and technician holds</text>
      <text x="940" y="678" font-size="12.5" fill="#F9FAF6">leave only when the owner says yes</text>
    </g>
  </g>
  <g stroke="#17191C" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M308 352 H370"/>
    <path d="M308 457 H370"/>
    <path d="M308 238 C 340 238, 340 242, 370 242"/>
    <path d="M608 242 H618"/>
    <path d="M492 294 V304"/>
    <path d="M608 362 H618"/>
    <path d="M740 414 V424"/>
    <path d="M856 470 H888 V352 H918"/>
    <path d="M1068 400 V412"/>
    <path d="M1068 592 V604"/>
  </g>
</svg>
