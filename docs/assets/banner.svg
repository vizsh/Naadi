<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="NAADI: machine pulse intelligence for small factories. A punched-card chain hangs beside the wordmark, its cards turning from slate to amber to vermilion as holes accumulate.">
  <defs>
    <pattern id="fine" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#406C62" stroke-opacity=".10" stroke-width="1"/></pattern>
    <pattern id="bold" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#406C62" stroke-opacity=".22" stroke-width="1"/></pattern>
    <g id="holes8">
      <circle cx="30" cy="12" r="0"/>
    </g>
  </defs>
  <rect width="1280" height="440" fill="#F3F4EF"/>
  <rect width="1280" height="440" fill="url(#fine)"/>
  <rect width="1280" height="440" fill="url(#bold)"/>
  <rect x="48" y="48" width="680" height="344" fill="#F9FAF6"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" fill="#17191C">
    <text x="80" y="160" font-size="88" font-weight="700" font-family="Nirmala UI, Kohinoor Devanagari, Devanagari Sangam MN, Noto Sans Devanagari, sans-serif">नाडी</text>
    <text x="284" y="158" font-size="34" font-weight="700" letter-spacing="9">NAADI</text>
    <text x="80" y="232" font-size="31" font-weight="600">Machine pulse intelligence for small factories</text>
    <text x="80" y="270" font-size="17.5" fill="#41474E">A punched-card digital twin, physics-first diagnosis, decisions priced</text>
    <text x="80" y="294" font-size="17.5" fill="#41474E">in rupees, and agents that prepare everything for the owner to approve.</text>
    <g font-size="13" font-weight="600" letter-spacing=".6">
      <rect x="80" y="324" width="122" height="28" fill="none" stroke="#656B72"/><text x="94" y="343">POWERLOOMS</text>
      <rect x="212" y="324" width="122" height="28" fill="none" stroke="#656B72"/><text x="226" y="343">FLOUR MILLS</text>
      <rect x="344" y="324" width="106" height="28" fill="none" stroke="#656B72"/><text x="358" y="343">PUMP SETS</text>
      <rect x="460" y="324" width="140" height="28" fill="#17191C"/><text x="474" y="343" fill="#F9FAF6">WORKS OFFLINE</text>
    </g>
  </g>

  <!-- the card chain: one card per six hours, holes for channels that left normal -->
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#41474E">
    <text x="826" y="66">LOOM 03 · LAST 12 CARDS · 3 DAYS</text>
  </g>
  <line x1="806" y1="80" x2="1194" y2="80" stroke="#9AA1A6" stroke-width="5"/>
  <g stroke="#17191C" stroke-opacity=".55" fill="none" stroke-width="1.2">
    <path d="M832 80 L826 96 L838 122 L826 148 L838 174 L826 200 L838 226 L826 252 L838 278 L826 304 L838 330 L826 356 L838 382"/>
    <path d="M1168 80 L1174 96 L1162 122 L1174 148 L1162 174 L1174 200 L1162 226 L1174 252 L1162 278 L1174 304 L1162 330 L1174 356 L1162 382"/>
  </g>
  <g>
    <!-- slate: inside normal, an isolated hole now and then -->
    <rect x="816" y="88" width="368" height="22" fill="#6E7B86"/>
    <rect x="828" y="114" width="344" height="22" fill="#56626C"/>
    <rect x="816" y="140" width="368" height="22" fill="#6E7B86"/>
    <rect x="828" y="166" width="344" height="22" fill="#56626C"/>
    <!-- amber: watch -->
    <rect x="816" y="192" width="368" height="22" fill="#D99A00"/>
    <rect x="828" y="218" width="344" height="22" fill="#B98300"/>
    <rect x="816" y="244" width="368" height="22" fill="#D99A00"/>
    <rect x="828" y="270" width="344" height="22" fill="#B98300"/>
    <!-- vermilion: act -->
    <rect x="816" y="296" width="368" height="22" fill="#C8372A"/>
    <rect x="828" y="322" width="344" height="22" fill="#A92E23"/>
    <rect x="816" y="348" width="368" height="22" fill="#C8372A"/>
    <rect x="828" y="374" width="344" height="22" fill="#A92E23"/>
  </g>
  <g fill="#17191C">
    <circle cx="912" cy="99" r="5.5"/>
    <circle cx="1044" cy="151" r="5.5"/>
    <circle cx="912" cy="177" r="5.5"/><circle cx="956" cy="177" r="5.5"/>
    <circle cx="912" cy="203" r="5.5"/><circle cx="956" cy="203" r="5.5"/><circle cx="1088" cy="203" r="5.5"/>
    <circle cx="912" cy="229" r="5.5"/><circle cx="956" cy="229" r="5.5"/><circle cx="868" cy="229" r="5.5"/>
    <circle cx="868" cy="255" r="5.5"/><circle cx="912" cy="255" r="5.5"/><circle cx="956" cy="255" r="5.5"/><circle cx="1088" cy="255" r="5.5"/>
    <circle cx="868" cy="281" r="5.5"/><circle cx="912" cy="281" r="5.5"/><circle cx="956" cy="281" r="5.5"/><circle cx="1088" cy="281" r="5.5"/>
    <circle cx="868" cy="307" r="5.5"/><circle cx="912" cy="307" r="5.5"/><circle cx="956" cy="307" r="5.5"/><circle cx="1088" cy="307" r="5.5"/><circle cx="1132" cy="307" r="5.5"/>
    <circle cx="868" cy="333" r="5.5"/><circle cx="912" cy="333" r="5.5"/><circle cx="956" cy="333" r="5.5"/><circle cx="1088" cy="333" r="5.5"/><circle cx="1132" cy="333" r="5.5"/>
    <circle cx="868" cy="359" r="5.5"/><circle cx="912" cy="359" r="5.5"/><circle cx="956" cy="359" r="5.5"/><circle cx="1044" cy="359" r="5.5"/><circle cx="1088" cy="359" r="5.5"/><circle cx="1132" cy="359" r="5.5"/>
    <circle cx="868" cy="385" r="5.5"/><circle cx="912" cy="385" r="5.5"/><circle cx="956" cy="385" r="5.5"/><circle cx="1088" cy="385" r="5.5"/><circle cx="1132" cy="385" r="5.5"/>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#41474E">
    <path d="M1194 88h14v22h-14" fill="none" stroke="#17191C"/>
    <text x="1214" y="104">6 h</text>
    <path d="M1132 396v16h-24" fill="none" stroke="#17191C"/>
    <text x="1100" y="417" text-anchor="end">a hole: one channel left its learned normal</text>
  </g>
</svg>
